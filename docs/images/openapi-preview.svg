<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">StockWatch OpenAPI preview</title>
  <desc id="desc">A stylized preview of the StockWatch Swagger UI with API endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="260" fill="#14b8a6" opacity=".10"/>
  <circle cx="80" cy="700" r="250" fill="#38bdf8" opacity=".09"/>
  <text x="74" y="86" fill="#99f6e4" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">STOCKWATCH • OPENAPI</text>
  <text x="74" y="130" fill="white" font-family="Arial, sans-serif" font-size="38" font-weight="700">Documented REST API</text>
  <rect x="74" y="170" width="1052" height="472" rx="18" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="74" y="170" width="1052" height="74" rx="18" fill="#0f172a"/>
  <rect x="74" y="224" width="1052" height="20" fill="#0f172a"/>
  <circle cx="112" cy="207" r="8" fill="#fb7185"/><circle cx="138" cy="207" r="8" fill="#fbbf24"/><circle cx="164" cy="207" r="8" fill="#4ade80"/>
  <text x="206" y="215" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">StockWatch</text>
  <text x="355" y="215" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">0.1.0  •  OpenAPI 3.1</text>
  <rect x="972" y="189" width="118" height="36" rx="8" fill="#14b8a6"/>
  <text x="994" y="213" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="700">Authorize</text>
  <text x="112" y="289" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">health</text>
  <g font-family="Arial, sans-serif">
    <rect x="112" y="309" width="976" height="51" rx="7" fill="#dcfce7" stroke="#86efac"/>
    <rect x="128" y="321" width="62" height="26" rx="5" fill="#22c55e"/>
    <text x="140" y="340" fill="white" font-size="14" font-weight="700">GET</text><text x="210" y="340" fill="#14532d" font-size="16" font-weight="700">/health</text><text x="330" y="340" fill="#166534" font-size="15">Проверить доступность сервиса</text>
    <text x="112" y="402" fill="#0f172a" font-size="20" font-weight="700">authentication</text>
    <rect x="112" y="422" width="976" height="51" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="128" y="434" width="62" height="26" rx="5" fill="#2563eb"/>
    <text x="137" y="453" fill="white" font-size="14" font-weight="700">POST</text><text x="210" y="453" fill="#1e3a8a" font-size="16" font-weight="700">/api/v1/auth/login</text><text x="430" y="453" fill="#1d4ed8" font-size="15">Получить JWT access/refresh token</text>
    <text x="112" y="515" fill="#0f172a" font-size="20" font-weight="700">price watches</text>
    <rect x="112" y="535" width="976" height="51" rx="7" fill="#f3e8ff" stroke="#d8b4fe"/>
    <rect x="128" y="547" width="62" height="26" rx="5" fill="#9333ea"/>
    <text x="137" y="566" fill="white" font-size="14" font-weight="700">POST</text><text x="210" y="566" fill="#581c87" font-size="16" font-weight="700">/api/v1/watches</text><text x="403" y="566" fill="#7e22ce" font-size="15">Создать отслеживание целевой цены</text>
  </g>
  <text x="74" y="687" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Interactive documentation • /docs • JWT protected routes</text>
</svg>
